{% extends 'adminhome.html' %}




{% block content %}
  <style>
      /* Sticky navbar styles */
      .header-area {
          position: sticky;
          top: 0;
          z-index: 1000;
          background-color: indigo; /* Violet background for the navbar */
      }

      .navbar {
          display: flex;
          justify-content: space-between;
          align-items: center;
          width: 100%;
      }

      .navbar .logo h1 {
          margin: 0;
          color: white; /* Logo text color */
      }

      .nav {
          display: flex;
          list-style: none;
          margin: 0;
          padding: 0;
      }

      .nav li {
          margin-right: 20px;
      }

      .nav a {
          text-decoration: none;
          color: white; /* White text for links */
          font-weight: bold;
          text-transform: uppercase;
      }

      .nav a.active {
          color: #ffcc00; /* Active link color (golden yellow) */
      }

      /* Menu Toggler (Hamburger) */
      .menu-trigger {
          display: none;
          cursor: pointer;
      }

      .menu-trigger span {
          font-size: 24px;
          color: white; /* White color for the hamburger icon */
      }

      /* Mobile View */
      @media (max-width: 768px) {
          .menu-trigger {
              display: block;
          }

          .nav {
              display: none;
              flex-direction: column;
              position: absolute;
              top: 60px;
              left: 0;
              width: 100%;
              background-color: violet; /* Keep violet background for mobile menu */
              box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
          }

          .nav.active {
              display: flex;
          }

          .nav li {
              margin: 10px 0;
              text-align: center;
          }

          .nav a {
              font-size: 18px;
              color: white; /* White text for mobile menu links */
          }
      }

      /* Smooth scrolling */
      html {
          scroll-behavior: smooth;
      }

      /* Registration form styles */
      .register-wrapper {
          max-width: 500px;
          margin: 100px auto;
          padding: 30px;
          background-color: #f9f9f9;
          border-radius: 8px;
          box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
      }

      .register-wrapper h2 {
          text-align: center;
          margin-bottom: 30px;
          font-size: 28px;
          color: indigo;
      }

      .form-label {
          font-weight: bold;
      }

      .btn-primary {
          background-color: indigo;
          color: white;
          border: none;
          padding: 10px 20px;
          width: 100%;
          font-size: 18px;
          border-radius: 5px;
      }

      .btn-primary:hover {
          background-color: #3d2a8b;
      }

      /* Alert styles for messages */
      .alert {
          margin-top: 20px;
          border-radius: 5px;
      }
  </style>

  <!-- Faculty Registration Form Start -->
  <div class="register-wrapper">
      <!-- Display messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
          {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                  <span aria-hidden="true">&times;</span>
              </button>
          </div>
          {% endfor %}
      {% endif %}
      {% endwith %}

    <form action="{{ url_for('Add_faculty') }}" method="POST">
          <h2 class="text-uppercase">Faculty Registration</h2>
          <div class="mb-3">
              <label for="fullname" class="form-label">Full Name*</label>
              <input type="text" class="form-control" id="fullname" name="fullname" required placeholder="Enter your full name">
          </div>
          <div class="mb-3">
              <label for="email" class="form-label">Email*</label>
              <input type="email" class="form-control" id="email" name="email" required placeholder="Enter your email">
          </div>
          <div class="mb-3">
              <label for="department" class="form-label">Department*</label>
              <input type="text" class="form-control" id="department" name="department" required placeholder="Enter your department">
          </div>
          <div class="mb-3">
              <label for="emp_id" class="form-label">Employee ID*</label>
              <input type="text" class="form-control" id="emp_id" name="emp_id" required placeholder="Enter your employee ID">
          </div>
          <div class="mb-3">
              <label for="pwd" class="form-label">Password*</label>
              <input type="password" class="form-control" id="pwd" name="pwd" required placeholder="Enter your password">
          </div>
          <div class="mb-3">
              <label for="cpwd" class="form-label">Confirm Password*</label>
              <input type="password" class="form-control" id="cpwd" name="cpwd" required placeholder="Confirm your password">
          </div>
          <div class="mb-3">
              <label for="mobile" class="form-label">Mobile Number*</label>
              <input type="text" class="form-control" id="mobile" name="mobile" required placeholder="Enter your mobile number">
          </div>
          <button type="submit" class="btn btn-primary">Register</button>
      </form>
  </div>
  <!-- Faculty Registration Form End -->

{% endblock %}


{% block scripts %}
  <script>
      // Toggle the mobile menu
      document.querySelector('.menu-trigger').addEventListener('click', function() {
          document.querySelector('.nav').classList.toggle('active');
      });
  </script>
{% endblock %}
